# deploy.yml — push-to-main CD for the whole platform. One detect job diffs the
# push against the last SUCCESSFULLY deployed commit (not event.before, so runs
# superseded in the concurrency queue are never lost), then each surface deploys
# only when its files changed:
#
#   site/** | cli/install.{sh,ps1}|host.ps1  -> site: build ONE content-addressed release (site/deploy.sh prepare: old
#                                               hashed chunks and CSP hashes kept 48h, installers in the tree), verify,
#                                               upload. site-deliver (environment site-release): mirror that exact CID to
#                                               every operator target in vars.SITE_DELIVERY_TARGETS (ssh hosts, kubo,
#                                               local roots), a journalled fenced rollout (pending = resolve), then publish through an owner-
#                                               approved session, or leave the owner's exact plan (docs/site-release.md)
#   relay/**                                 -> scp to the relay box + systemd restart (relay/deploy.sh)
#   contracts/<Name>.sol                     -> deploy that contract to Base (scripts/deploy-*.mjs),
#                                               gated on the `contract-deploy` environment approval,
#                                               then commit the address wiring back to main
#   Dockerfile|supervisor.js|package*.json   -> supervisor image  } the wasm-manager image is built +
#   wasm/**                                  -> wasm-manager image} repinned here (scripts/release.sh);
#   metal/** (code)                          -> release only      } the supervisor is built by
#   enclaves/cpu/config.yml (non-image)      -> release only      } release-cpu.yml
#                                            -> then auto-dispatch release-cpu.yml with the next
#                                               patch version (vX.Y.Z-cpu): it builds the supervisor
#                                               image, tags, and publishes the GitHub Release that
#                                               metal boxes follow (metal/update.mjs)
#
# Loop safety: commits made here use GITHUB_TOKEN, which never retriggers push
# workflows, and detect ignores commits authored by github-actions[bot].
#
# One-time setup (secrets/vars/environment + host keys): scripts/ci-setup.sh.
# What stays manual: approving contract deploys (environment gate). Metal
# boxes pull each published release on their own timer (metal/update.mjs);
# nothing here pushes to them.

name: Deploy

run-name: Deploy ${{ github.sha }}

on:
  # Source integration must not activate unqualified RPC/lifecycle candidates.
  # Release the reviewed composition explicitly after its runtime gates pass.
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never kill a deploy mid-flight; queued runs are covered by the detect diff

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read     # read this workflow's past runs to find the last deployed sha
    outputs:
      site:          ${{ steps.diff.outputs.site }}
      relay:         ${{ steps.diff.outputs.relay }}
      registry:      ${{ steps.diff.outputs.registry }}
      deployments:   ${{ steps.diff.outputs.deployments }}
      catalog:       ${{ steps.diff.outputs.catalog }}
      enclavepay:        ${{ steps.diff.outputs.enclavepay }}
      contracts_any: ${{ steps.diff.outputs.contracts_any }}
      wasm:          ${{ steps.diff.outputs.wasm }}
      cpu_release:   ${{ steps.diff.outputs.cpu_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against the last successfully deployed commit
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_OVERRIDE: ${{ vars.DEPLOY_BASE_OVERRIDE }}
        run: |
          set -euo pipefail

          # Base = head of the last successful Deploy run; falls back to the
          # push's before-sha, then to HEAD^ (first run / force push).
          # Recovery override: when the last-success baseline is stale because
          # its changes were deployed MANUALLY while runs stayed red (so every
          # push re-prompts e.g. a contract redeploy), set the repo variable
          # DEPLOY_BASE_OVERRIDE to the already-deployed sha; delete it after
          # the next green run re-establishes a real baseline.
          BASE="${BASE_OVERRIDE:-}"
          [ -n "$BASE" ] && echo "using DEPLOY_BASE_OVERRIDE=$BASE"
          if [ -z "$BASE" ]; then
            BASE="$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
                    --jq '.workflow_runs[0].head_sha // empty' || true)"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$EVENT_BEFORE"
          fi
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="";; esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          echo "diff base: ${BASE:-<none>} -> $GITHUB_SHA"

          # Changed files across HUMAN commits only: wiring/repin commits pushed
          # by this workflow (author github-actions[bot]) are already deployed
          # state and must not retrigger anything.
          HUMAN_COMMITS=""
          CHANGED=""
          if [ -n "$BASE" ] && [ "$BASE" != "$GITHUB_SHA" ]; then
            HUMAN_COMMITS="$(git log --no-merges --format='%H%x09%an' "$BASE..$GITHUB_SHA" \
                             | awk -F'\t' '$2 != "github-actions[bot]" {print $1}')"
            [ -n "$HUMAN_COMMITS" ] && CHANGED="$(echo "$HUMAN_COMMITS" \
                             | xargs -r -n1 git show --name-only --format= | sort -u)"
          fi
          printf 'changed files:\n%s\n' "${CHANGED:-<none>}"

          site=false relay=false registry=false deployments=false catalog=false enclavepay=false
          paymentrouter=false
          sup=false wasm=false metal=false config_touched=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              site/deploy.sh|relay/deploy.sh) ;;   # deploy tooling runs from a fresh checkout; nothing to redeploy
              scripts/site-release/*) ;;            # release tooling (site/deploy.sh), likewise
              site/*)                  site=true ;;
              cli/install.sh|cli/install.ps1|cli/host.ps1) site=true ;;   # served from /opt/enclave-get (curl|sh installers; host.ps1 = the Windows host)
              relay/*)                 relay=true ;;
              contracts/EnclaveRegistry.sol)    registry=true ;;
              contracts/EnclaveDeployments.sol) deployments=true ;;
              contracts/EnclaveAppCatalog.sol)  catalog=true ;;
              contracts/EnclavePay.sol)         enclavepay=true ;;
              contracts/PaymentRouter.sol)      paymentrouter=true ;;
              contracts/EnclaveCreditVault.sol) ;;   # vault factory deploys from the admin console (browser wallet), never CI
              contracts/foundry/*|foundry.toml) ;;   # Foundry test toolchain only - deploys stay solc-via-JS
              Dockerfile|supervisor.js|package.json|package-lock.json) sup=true ;;
              # GPU worker + MPS sidecars: only the retired GPU flavors (enclaves/gpu,
              # enclaves/gpu8, removed 2026-10-14 with the hosted fleet) shipped
              # them, so no released config carries their images any more.
              worker/*|mps-daemon/*) ;;
              wasm/__pycache__/*) ;;
              wasm/Dockerfile.wasmtime|wasm/wasmtime-onnx-gpu-strict.patch) ;;   # toolchain-image inputs, built by toolchain.yml, pinned into Dockerfile.wasm by digest
              # Ignore rules are not build inputs. `wasm/*` matches at any depth,
              # so adding wasm/nvenc-shim/.gitignore rebuilt the wasm-manager
              # image, repinned its digest, and was about to cut a measured
              # release and repoint the fleet (run 32983352553, cancelled) for a
              # file nothing in the image reads.
              wasm/.gitignore|wasm/*/.gitignore) ;;
              wasm/*)                  wasm=true ;;
              # Metal guest/launcher code ships ONLY via tags: a metal box's
              # update flow (metal/update.mjs) builds the guest image at the
              # latest -cpu tag, so a metal-only change that cuts no release
              # is undeployable (found 2026-09-01: the gsup.mjs ring
              # stand-down sat ungated behind this filter). Docs and ignore
              # rules are not build inputs; metal/build/ is gitignored.
              metal/.gitignore|metal/*/.gitignore) ;;
              metal/*.md|metal/*/*.md) ;;
              metal/*)                 metal=true ;;
              enclaves/*)              config_touched=true ;;
            esac
          done <<< "$CHANGED"

          # A config edit needs a new measured release — but image-digest repins
          # are pinned by the release flow itself, so only non-image lines count.
          # NEVER end this pipeline in `grep -q`. grep -q exits on the FIRST
          # match, which SIGPIPEs the upstream greps; under `set -o pipefail`
          # the pipeline then reports 141, `&& config=true` never runs, and a
          # real config change silently cuts NO release. set -e does not catch
          # it either (a failure before the final && is exempt), so the step
          # stays green and just reports release=false.
          # It is a race on diff SIZE: a small enclaves edit finishes writing
          # before grep -q exits and does release, a large one does not —
          # which is why 56f475ec released and 54875a52 (177 diff lines,
          # 2026-07-28) did not, from what looked like the same kind of edit.
          # Read the whole diff into a variable instead.
          config=false
          if [ "$config_touched" = true ]; then
            config_diff="$(echo "$HUMAN_COMMITS" | xargs -r -I{} git show --format= {} -- enclaves \
                           | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                           | grep -vE '^[+-][[:space:]]*-?[[:space:]]*image:' || true)"
            [ -n "$config_diff" ] && config=true
          fi

          contracts_any=false
          if [ "$registry" = true ] || [ "$deployments" = true ] || [ "$catalog" = true ] || [ "$enclavepay" = true ] || [ "$paymentrouter" = true ]; then
            contracts_any=true
          fi
          # Metal boxes track the -cpu tags (their update flow builds the
          # guest at that tag), so metal code rides the CPU release.
          cpu_release=false
          if [ "$sup" = true ] || [ "$wasm" = true ] || [ "$config" = true ] || [ "$metal" = true ]; then
            cpu_release=true
          fi

          {
            echo "site=$site"; echo "relay=$relay"
            echo "registry=$registry"; echo "deployments=$deployments"
            echo "catalog=$catalog"; echo "enclavepay=$enclavepay"
            echo "paymentrouter=$paymentrouter"
            echo "contracts_any=$contracts_any"
            echo "wasm=$wasm"
            echo "cpu_release=$cpu_release"
          } | tee -a "$GITHUB_OUTPUT"

  # Contract deploys are irreversible and rotate on-chain addresses (old
  # registry entries / deployment balances do NOT migrate), so they wait for a
  # one-click approval on the `contract-deploy` environment. Rejecting the
  # review skips the deploy and unblocks the queue.
  #
  # HAND-DEPLOY MODE (repo variable CONTRACTS_HAND_DEPLOY=1): the deployer key
  # is a GOVERNANCE root - catalog approvals decide what code attested enclaves
  # will run - so the operator keeps it off GitHub entirely. This job is then
  # SKIPPED (green, not failed: a red job would block the release job and
  # freeze detect's green baseline) and contracts-notice below says what to run
  # locally instead. Delete the variable to return to gated CI deploys.
  contracts:
    needs: detect
    if: needs.detect.outputs.contracts_any == 'true' && vars.CONTRACTS_HAND_DEPLOY != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: contract-deploy
    permissions:
      contents: write   # push the address-wiring commit back to main
    outputs:
      wired_site:   ${{ steps.wire.outputs.wired_site }}
      wired_config: ${{ steps.wire.outputs.wired_config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Deploy changed contracts
        id: deploy
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          NETWORK: ${{ vars.CONTRACTS_NETWORK || 'base' }}
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS || '' }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOYER_PRIVATE_KEY" ] || { echo "::error::DEPLOYER_PRIVATE_KEY is not set on the contract-deploy environment"; exit 1; }
          REG='${{ needs.detect.outputs.registry }}'
          DEP='${{ needs.detect.outputs.deployments }}'
          CAT='${{ needs.detect.outputs.catalog }}'
          PAY='${{ needs.detect.outputs.enclavepay }}'
          PRT='${{ needs.detect.outputs.paymentrouter }}'
          if [ "$REG" = "true" ]; then
            node scripts/deploy-registry.mjs --yes
            DEP=true   # claims are gated to the registry: a new registry needs a new deployments ledger
          fi
          if [ "$PAY" = "true" ]; then node scripts/deploy-enclave-pay.mjs --yes; fi
          if [ "$DEP" = "true" ]; then node scripts/deploy-deployments.mjs --yes; fi
          if [ "$CAT" = "true" ]; then node scripts/deploy-app-catalog.mjs --yes; fi
          if [ "$PRT" = "true" ]; then
            [ -n "$TREASURY_ADDRESS" ] || { echo "::error::TREASURY_ADDRESS is not set on the contract-deploy environment (the router's treasury is immutable - set the variable before deploying)"; exit 1; }
            node scripts/deploy-payment-router.mjs --yes
          fi

      # Runs even if a later deploy in the sequence failed, so any address that
      # DID land on-chain is committed rather than stranded in the job log.
      - name: Commit address wiring back to main
        id: wire
        if: always() && steps.deploy.outcome != 'skipped'
        run: |
          set -euo pipefail
          bash scripts/sync-contract-addresses.sh
          git add contracts/*.abi.json enclaves site/index.html scripts/enclave-discover.mjs
          if git diff --cached --quiet; then
            echo "wired_site=false" >> "$GITHUB_OUTPUT"
            echo "wired_config=false" >> "$GITHUB_OUTPUT"
            echo "nothing to wire"; exit 0
          fi
          # same `grep -q` + pipefail hazard as the detect job above: a wiring
          # commit that touched enclaves/ would report wired_config=false and
          # skip the release. The output is short enough that it usually wins
          # the race, which is exactly what makes it worth not relying on.
          wired_site=false; wired_config=false
          wired_files="$(git diff --cached --name-only)"
          # grep WITHOUT -q: it reads its input to the end, so the upstream
          # never takes SIGPIPE and pipefail cannot turn a match into a false.
          echo "$wired_files" | grep -E '^site/'     >/dev/null && wired_site=true
          echo "$wired_files" | grep -E '^enclaves/' >/dev/null && wired_config=true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: wire contract addresses after deploy"
          git fetch origin main && git rebase origin/main   # works on the detached-HEAD checkout
          git push origin HEAD:main
          echo "wired_site=$wired_site" >> "$GITHUB_OUTPUT"
          echo "wired_config=$wired_config" >> "$GITHUB_OUTPUT"

  # Hand-deploy mode's reminder: contract sources changed but CI deliberately
  # holds no deployer key. Emits the exact local commands; always green.
  contracts-notice:
    needs: detect
    if: needs.detect.outputs.contracts_any == 'true' && vars.CONTRACTS_HAND_DEPLOY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contract change needs a hand deploy
        run: |
          echo "::warning::Contract sources changed (registry=${{ needs.detect.outputs.registry }} deployments=${{ needs.detect.outputs.deployments }} catalog=${{ needs.detect.outputs.catalog }} enclavepay=${{ needs.detect.outputs.enclavepay }} paymentrouter=${{ needs.detect.outputs.paymentrouter }}) but CONTRACTS_HAND_DEPLOY=1: CI holds no deployer key (it is a governance root). Deploy locally with DEPLOYER_PRIVATE_KEY=... node scripts/deploy-<contract>.mjs --yes, then bash scripts/sync-contract-addresses.sh, commit and push - the next run deploys the site and cuts the enclave releases with the new addresses."

  site:
    needs: [detect, contracts]
    # runs on site changes, or when a contract deploy rewired site/index.html;
    # !cancelled() lets it run when the contracts job was skipped or rejected
    if: >-
      !cancelled() &&
      (needs.detect.outputs.site == 'true' || needs.contracts.outputs.wired_site == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cid: ${{ steps.prepare.outputs.cid }}
      commit: ${{ steps.checkout.outputs.commit }}

    steps:
      - name: Checkout main tip (includes any wiring commit)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record the commit the release is built from
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # the site bundler (scripts/build-site.mjs, run by deploy.sh prepare) needs
      # esbuild + @tailwindcss/cli from devDependencies
      - name: Install build dependencies
        run: npm ci

      # The release being replaced, so cached tabs keep their hashed chunks and CSP hashes: fetched by CID from the
      # operator's gateways, which are untrusted (the CAR must verify to the CID). There is no default host and no
      # fallback: without a configured base the job fails, unless the operator chose a no-base release explicitly.
      - name: Fetch the base release (verified by CID)
        env:
          BASE_CID: ${{ vars.SITE_RELEASE_BASE_CID }}
          GATEWAYS: ${{ vars.SITE_RELEASE_GATEWAYS }}
          BASE_MODE: ${{ vars.SITE_RELEASE_BASE }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_CID" ]; then
            [ -n "$GATEWAYS" ] || { echo "::error::SITE_RELEASE_BASE_CID is set but SITE_RELEASE_GATEWAYS (comma-separated https gateways) is not"; exit 1; }
            node scripts/site-release/cli.mjs fetch --cid "$BASE_CID" --gateway "$GATEWAYS" --out "$RUNNER_TEMP/site-base" --as-base
            echo "SITE_BASE_ARGS=--base $RUNNER_TEMP/site-base/$BASE_CID" >> "$GITHUB_ENV"
          elif [ "$BASE_MODE" = "none" ]; then
            echo "::warning::SITE_RELEASE_BASE=none: this release keeps no older hashed chunks or CSP hashes"
            echo "SITE_BASE_ARGS=--no-base-i-accept-dropping-old-chunks" >> "$GITHUB_ENV"
          else
            echo "::error::set SITE_RELEASE_BASE_CID (the release being replaced) and SITE_RELEASE_GATEWAYS, or SITE_RELEASE_BASE=none (docs/site-release.md)"
            exit 1
          fi

      - name: Prepare and verify the site release
        id: prepare
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # SITE_BASE_ARGS is a flag and its value
          bash site/deploy.sh prepare --out "$RUNNER_TEMP/site-release" $SITE_BASE_ARGS | tee "$RUNNER_TEMP/site-release.txt"
          cid="$(sed -n 's/^site release \(b[a-z2-7]\{58\}\)$/\1/p' "$RUNNER_TEMP/site-release.txt" | head -1)"
          [ -n "$cid" ] || { echo "::error::no release CID in the prepare output"; exit 1; }
          node scripts/site-release/cli.mjs verify "$RUNNER_TEMP/site-release/$cid"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          { echo '### Site release `'"$cid"'`'; echo; echo '```'; cat "$RUNNER_TEMP/site-release.txt"; echo '```'; echo;
            echo "Mirror and activate on your targets with \`site/deploy.sh mirror|activate --release DIR --targets FILE --approve $cid\`,"
            echo "then publish with \`site/deploy.sh publish-plan\` and the owner's \`enclave config set\`."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release (the reviewed, verified tree and its derived files)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-release-${{ steps.prepare.outputs.cid }}
          path: ${{ runner.temp }}/site-release/${{ steps.prepare.outputs.cid }}
          include-hidden-files: true   # the tree carries .well-known/ (the release ledger, security.txt)
          if-no-files-found: error
          retention-days: 30

  # Delivery of the CID the site job built and reviewed: every operator target holds it (verified there), then every
  # activatable target serves it (a journalled, fenced rollout: a failure is compensated; an unknown outcome fails this job
  # as PENDING with the journal uploaded for `site-release resolve`), then publication. Targets and credentials are the
  # operator's (vars/secrets below); nothing names a host. Add protection rules to the `site-release` environment to
  # make a person approve the CID shown in the site job's summary before this runs (optional: GitHub is only the
  # runner here; `site/deploy.sh deliver` does the same from an operator's machine).
  site-deliver:
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site-release
    permissions:
      contents: read
      actions: read   # download this run's release artifact

    steps:
      - name: Checkout the commit the release was built from (the same tool)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.site.outputs.commit }}
          persist-credentials: false

      - name: Is delivery configured?
        id: cfg
        env:
          TARGETS: ${{ vars.SITE_DELIVERY_TARGETS }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "::warning::SITE_DELIVERY_TARGETS is not set: release ${{ needs.site.outputs.cid }} was built and uploaded but NOT delivered or published (docs/site-release.md)"
            echo "deliver=false" >> "$GITHUB_OUTPUT"
          else
            echo "deliver=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and re-verify the reviewed release
        if: steps.cfg.outputs.deliver == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ needs.site.outputs.cid }}
        run: |
          set -euo pipefail
          # the artifact is transport only: the tree must re-verify to the CID the site job reviewed
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "site-release-$CID" -D "$RUNNER_TEMP/release/$CID"
          node scripts/site-release/cli.mjs verify "$RUNNER_TEMP/release/$CID"

      - name: Deliver (mirror every target, then a journalled, fenced rollout)
        if: steps.cfg.outputs.deliver == 'true'
        env:
          TARGETS: ${{ vars.SITE_DELIVERY_TARGETS }}
          CID: ${{ needs.site.outputs.cid }}
          # referenced from the targets file BY NAME (keyEnv, knownHostsEnv, authEnv); the tool never prints them
          SITE_DELIVERY_SSH_KEY: ${{ secrets.SITE_DELIVERY_SSH_KEY }}
          SITE_DELIVERY_KNOWN_HOSTS: ${{ secrets.SITE_DELIVERY_KNOWN_HOSTS }}
          SITE_DELIVERY_KUBO_AUTH: ${{ secrets.SITE_DELIVERY_KUBO_AUTH }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGETS" > "$RUNNER_TEMP/targets.json"
          # exit 0 active; 1 reverted (no target serves it as a result of this rollout); 5 PENDING: an outcome is unknown,
          # hosts may differ, and the uploaded journal + `site-release resolve` settles it (it never re-sends an activation)
          set +e
          node scripts/site-release/cli.mjs deliver --release "$RUNNER_TEMP/release/$CID" --targets "$RUNNER_TEMP/targets.json" --approve "$CID" \
            --journal "$RUNNER_TEMP/rollouts" > "$RUNNER_TEMP/delivery.txt" 2> "$RUNNER_TEMP/delivery.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/delivery.txt"; cat "$RUNNER_TEMP/delivery.err" >&2
          case "$code" in
            0) title="delivered and active on every target" ;;
            1) title="NOT delivered: the rollout failed and was reverted" ;;
            5) title="PENDING: an outcome is unknown; resolve it with the uploaded journal"
               echo "::error::rollout of $CID is pending: $(tail -2 "$RUNNER_TEMP/delivery.err" | tr '\n' ' ')" ;;
            *) title="failed (exit $code)" ;;
          esac
          { echo '### Site release `'"$CID"'`: '"$title"; echo; echo '```'; cat "$RUNNER_TEMP/delivery.txt" "$RUNNER_TEMP/delivery.err"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Install the enclave CLI's dependencies (publication runs the CLI)
        if: steps.cfg.outputs.deliver == 'true' && vars.SITE_PUBLISH_CONFIG != ''
        run: npm ci --no-audit --no-fund

      - name: Upload the rollout journal (what resolve needs after any interruption)
        if: always() && steps.cfg.outputs.deliver == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-rollout-journal-${{ needs.site.outputs.cid }}
          path: ${{ runner.temp }}/rollouts
          if-no-files-found: ignore
          retention-days: 90

      # Publication: the IPNS name moves to /ipfs/<CID> under the publisher's EXISTING key. With an owner-approved
      # session limited to deploy.setConfig (the publisher record held by the owner's vault as staging), this is the
      # session's config change, through the enclave CLI. Otherwise the owner's exact operation is left as an artifact
      # and the publication is reported PENDING (the release is already live on every target).
      - name: Publish (an owner-approved session, or the owner's exact plan)
        id: publish
        if: steps.cfg.outputs.deliver == 'true'
        env:
          PUBLICATION: ${{ vars.SITE_PUBLISH_CONFIG }}
          CID: ${{ needs.site.outputs.cid }}
          ENCLAVE_SESSION: ${{ secrets.SITE_PUBLISH_SESSION }}   # an exported session (enclave session new --env)
          ENCLAVE_KEY: ${{ secrets.SITE_PUBLISH_GAS_KEY }}       # a gas payer: it authorizes nothing
        run: |
          set -uo pipefail
          if [ -z "$PUBLICATION" ]; then
            echo "::warning::SITE_PUBLISH_CONFIG is not set: release $CID is live on the targets, but the IPNS name was NOT moved (docs/site-release.md)"
            exit 0
          fi
          printf '%s' "$PUBLICATION" > "$RUNNER_TEMP/publication.json"
          node scripts/site-release/cli.mjs publish --release "$RUNNER_TEMP/release/$CID" --publish "$RUNNER_TEMP/publication.json" \
            --approve "$CID" --plan-out "$RUNNER_TEMP/publication-plan" | tee "$RUNNER_TEMP/publish.txt"
          code=${PIPESTATUS[0]}
          case "$code" in
            0) echo "### IPNS publication: the publisher's on-chain config now holds /ipfs/$CID" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "::warning::publication of $CID is PENDING the owner's authorization: the exact plan is the publication-plan artifact"
               echo "### IPNS publication PENDING the owner (plan uploaded)" >> "$GITHUB_STEP_SUMMARY"; echo "pending=true" >> "$GITHUB_OUTPUT" ;;
            4) echo "::error::the publication's outcome is unknown (it may have landed): check enclave config show before anything else"; exit 4 ;;
            *) exit "$code" ;;
          esac

      - name: Upload the owner's publication plan
        if: steps.publish.outputs.pending == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-publication-plan-${{ needs.site.outputs.cid }}
          path: ${{ runner.temp }}/publication-plan
          if-no-files-found: error
          retention-days: 30

  relay:
    needs: detect
    if: needs.detect.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          persist-credentials: false

      # The operator selects every target (repository variables; nothing is discovered or defaulted, and there is no
      # alias fallback). relay/deploy.sh refuses, naming the missing role and variable, before any secret is written.
      #   RELAY_DEPLOY_ROLES  api | dns | api,dns
      #   RELAY_API_TARGET / RELAY_API_DIR   user@host of the API host / the installed enclave-api-relay WorkingDirectory
      #   RELAY_DNS_TARGET / RELAY_DNS_DIR   user@host of the DNS host / the installed enclave-dns WorkingDirectory
      #   DEPLOY_KNOWN_HOSTS                 those hosts' keys (strict host-key checking; no trust on first use)
      - name: Check relay targets
        env:
          RELAY_DEPLOY_ROLES: ${{ vars.RELAY_DEPLOY_ROLES }}
          RELAY_API_TARGET: ${{ vars.RELAY_API_TARGET }}
          RELAY_API_DIR: ${{ vars.RELAY_API_DIR }}
          RELAY_DNS_TARGET: ${{ vars.RELAY_DNS_TARGET }}
          RELAY_DNS_DIR: ${{ vars.RELAY_DNS_DIR }}
        run: bash relay/deploy.sh --check-config

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::DEPLOY_SSH_KEY secret is not set (run scripts/ci-setup.sh)"; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::DEPLOY_KNOWN_HOSTS is not set: the relay targets' host keys are required (strict host-key checking)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy relay
        env:
          RELAY_DEPLOY_ROLES: ${{ vars.RELAY_DEPLOY_ROLES }}
          RELAY_API_TARGET: ${{ vars.RELAY_API_TARGET }}
          RELAY_API_DIR: ${{ vars.RELAY_API_DIR }}
          RELAY_DNS_TARGET: ${{ vars.RELAY_DNS_TARGET }}
          RELAY_DNS_DIR: ${{ vars.RELAY_DNS_DIR }}
        run: bash relay/deploy.sh

  # Builds the wasm-manager image when wasm/** changed and repins its digest
  # via scripts/release.sh, then dispatches release-cpu.yml - which builds the
  # supervisor image itself, tags, and publishes the GitHub Release - with the
  # next patch version.
  release:
    needs: [detect, contracts]
    # A CPU-only change (e.g. metal/*) must run this job too: it used to skip
    # the whole job and cut nothing (found 2026-09-01 — v0.5.535-cpu was hand-
    # dispatched to ship the gsup.mjs ring stand-down).
    if: >-
      !cancelled() && needs.contracts.result != 'failure' &&
      (needs.detect.outputs.cpu_release == 'true' || needs.contracts.outputs.wired_config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # push the digest-repin commit
      packages: write   # push the wasm-manager image to ghcr
      actions: write    # dispatch release-cpu.yml

    steps:
      - name: Checkout main tip (includes any wiring commit)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Build, push, and repin the changed sidecar image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGETS=""
          [ '${{ needs.detect.outputs.wasm }}'   = 'true' ] && TARGETS="$TARGETS enclave-wasm-manager"
          if [ -z "$TARGETS" ]; then echo "no sidecar images changed"; exit 0; fi

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          ./scripts/release.sh $TARGETS

          git add enclaves
          if git diff --cached --quiet; then echo "digests unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: repin sidecar image digests ($TARGETS )"
          git fetch origin main && git rebase origin/main
          git push origin HEAD:main

      - name: Dispatch the CPU release and wait for its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The counter runs over EVERY vX.Y.Z[-cpu] tag: the retired GPU flavor
          # released bare vX.Y.Z tags off the same counter, and a version
          # computed from -cpu tags alone could collide with one of those.
          LATEST="$(git ls-remote --tags origin 'refs/tags/v*' | awk '{print $2}' | sed 's#refs/tags/##; s#-cpu$##' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          LATEST="${LATEST:-v0.0.0}"
          IFS=. read -r MA MI PA <<<"${LATEST#v}"
          VERSION="v${MA}.${MI}.$((PA + 1))-cpu"
          echo "releasing $VERSION (latest was $LATEST)"

          gh workflow run release-cpu.yml -f "version=${VERSION}"

          # Wait for release-cpu.yml to create the tag (it creates the tag and
          # the GitHub Release in one call): keeps this run "green = released"
          # and serializes version numbers behind the deploy-main concurrency group.
          ref="refs/tags/${VERSION}"
          DEADLINE=$((SECONDS + 900))
          until git ls-remote --exit-code --tags origin "$ref" >/dev/null 2>&1; do
            if [ $SECONDS -gt $DEADLINE ]; then
              echo "::error::timed out waiting for $ref — check the Release (CPU) workflow run"
              exit 1
            fi
            sleep 20
          done
          echo "$ref created; metal boxes pick it up on their next update tick (metal/update.mjs)"
