# CPU release workflow: the release a metal box's update flow follows.
#
# deploy.yml dispatches this on main with the next `vX.Y.Z-cpu` version when a
# release-relevant file changes (supervisor, wasm/**, metal/**, the config).
# It can also be run by hand from the Actions tab ("Run workflow").
#
# What a release is, and who reads it: metal/update.mjs on each box lists this
# repo's GitHub Releases, takes the newest `-cpu` tag, fetches that tag, and runs
# metal/build-image.mjs inside a worktree at it. That build pulls
# ghcr.io/enclavehost/enclave-supervisor:<tag> (the image the build job below
# pushes) and reads enclaves/cpu/config.yml at the tag (the supervisor env and
# the wasm-manager pin). So a release needs exactly four things, all made here
# or already committed:
#   1. the image  ghcr.io/enclavehost/enclave-supervisor:<tag>   (build job)
#   2. the git tag <tag> on the commit the image was built from  (release job)
#   3. a GitHub Release named by that tag                        (release job)
#   4. enclaves/cpu/config.yml in that commit                    (committed on main)
# No release asset is read by anything; the notes record the image digest for
# humans.
#
# Versions MUST end in "-cpu" (e.g. v1.0.0-cpu): metal/update.mjs selects
# releases by that suffix, and deploy.yml's version counter strips it.
#
# NOTE: the ghcr path is hardcoded LOWERCASE (ghcr.io/enclavehost/...). The repo
# could gain mixed casing someday; ${{ github.repository }} would emit that
# verbatim and ghcr wants lowercase.

name: Release (CPU)

run-name: Release ${{ inputs.version }} (CPU)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CPU release version (must end in -cpu, e.g. v1.0.0-cpu)'
        required: true
        type: string

concurrency:
  group: release-cpu-${{ inputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read    # checkout + check the tag does not exist
      packages: write   # push the container image
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Validate version and check the tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cpu$ ]]; then
            echo "::error::CPU release versions look like vX.Y.Z-cpu (got: $VERSION)"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          [ -f enclaves/cpu/config.yml ] || { echo "::error::enclaves/cpu/config.yml is missing: metal/build-image.mjs reads it at the tag"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN pushes fine now that every package exists and grants this
          # repo Actions access (a brand-new package name needs a one-time web-UI
          # creation before its first push).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the supervisor image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/enclavehost/enclave-supervisor:${{ inputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and the GitHub Release

    steps:
      # Tag and Release in ONE call: `gh release create --target` makes the tag
      # on the commit this run built from, so the tag never exists without its
      # Release (deploy.yml waits on the tag; metal/update.mjs lists Releases).
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build job reported no image digest (got: '$DIGEST')"; exit 1; }
          NOTES="$(printf '%s\n' \
            "CPU release built from ${GITHUB_SHA}." \
            "" \
            "Supervisor image: \`ghcr.io/enclavehost/enclave-supervisor:${VERSION}\`" \
            "(\`ghcr.io/enclavehost/enclave-supervisor@${DIGEST}\`)." \
            "" \
            "Metal boxes pick this up through metal/update.mjs, which builds the guest image at this tag.")"
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --latest
          gh release view "$VERSION" --json tagName,isDraft,isPrerelease \
            --jq '"released \(.tagName) (draft=\(.isDraft), prerelease=\(.isPrerelease))"'
