# Secret scan - the CI backstop for .githooks/pre-push. It refuses raw
# cryptocurrency private keys (Ethereum/Bitcoin hex, WIF, xprv, BIP39 seed
# phrases, keystore JSON) and the usual provider tokens. GitHub's free-plan
# secret scanning / push protection only knows provider tokens, so nothing on
# GitHub's side would notice an Ethereum key; and CI runs AFTER the push, so
# the hook is the actual block - this job is the signal that the hook was
# skipped (--no-verify, a clone without core.hooksPath) or that a rule regressed.
#
# push / pull_request: the pushed range only. schedule / dispatch: the whole
# history, crypto rules only (the default provider rules were hand-triaged over
# the full history on 2026-09-23 - 99 false positives, no real secret - and
# would never go green there). Read-only, no secrets, never a deploy gate.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar xzf gl.tgz -C "$HOME/bin" gitleaks && echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/gitleaks" version

      - name: Pick the range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          full=false
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE..HEAD"
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif [ "$EVENT" = push ]; then
            # brand-new branch: everything not already on some OTHER remote branch
            # (--exclude patterns for --remotes omit the refs/remotes/ prefix)
            range="$AFTER --not --exclude=origin/$BRANCH --exclude=origin/HEAD --remotes=origin"
          else
            range="--all"; full=true
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "scanning: $range (full=$full)"

      - name: Scanner self-test
        run: python3 .githooks/scan-crypto-keys.py --selftest

      # The gitleaks CONFIG must find generated private keys and tolerate the look-alikes, and no global allowlist may
      # swallow a bare 64-hex secret (2026-09-25: an unscoped one had silenced every ethereum-private-key-* rule).
      - name: gitleaks config self-test (generated keys found, look-alikes tolerated)
        run: python3 .githooks/gitleaks-selftest.py

      # The pre-push hook, run for real through an absolute core.hooksPath from a linked worktree: the pushed commit's
      # .gitleaks.toml governs, an unloadable one falls back to the hook's own, the crypto scanner always runs.
      - name: pre-push hook self-test (the pushed commit's config governs)
        run: python3 .githooks/hook-selftest.py

      - name: Cryptocurrency private keys (scan-crypto-keys.py)
        run: python3 .githooks/scan-crypto-keys.py --range ${{ steps.range.outputs.range }}

      - name: gitleaks (provider tokens + .gitleaks.toml crypto rules)
        if: steps.range.outputs.full == 'false'
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact=60 --exit-code 1 --log-opts="${{ steps.range.outputs.range }}"

      - name: gitleaks, whole history, crypto rules only
        if: steps.range.outputs.full == 'true'
        run: |
          gitleaks git . --config .gitleaks.toml --no-banner --redact=60 --exit-code 1 --log-opts="--all" \
            --enable-rule bitcoin-wif-private-key --enable-rule bip32-extended-private-key \
            --enable-rule bip39-mnemonic-labelled --enable-rule ethereum-private-key-labelled \
            --enable-rule ethereum-private-key-env --enable-rule ethereum-private-key-constructor \
            --enable-rule web3-keystore-json
