# Test suite - the repo's first test-running CI. Deliberately DISJOINT from
# deploy.yml: its own concurrency group, read-only permissions, no secrets,
# deployment is an explicit, separately reviewed workflow_dispatch. It runs
# as the source-integration signal: unit (node:test, hermetic - stub RPC + stub Stripe),
# contracts (Foundry unit + fuzz + the PaymentRouter zero-balance invariant),
# and e2e (Playwright: passkeys via the CDP virtual authenticator, the hybrid
# checkout against anvil + a Stripe stub).
name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Scheduler parity checks read explicitly pinned historical sources.
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
      - name: Install dependencies (root + relay)
        run: |
          # bsdtar: metal/oci-pull.mjs extracts OCI layers with it (whiteout
          # handling), so oci-pull.test.mjs fails as spawnSync ENOENT without
          # it. ubuntu-latest ships GNU tar only. A single red test made the
          # whole suite read as failing on every push, which is how a real
          # regression hides — cheaper to install the tool than to lose the signal.
          #
          # python3-numpy: shielded/reference/shielded_ref.py imports it, and
          # shielded-reference.test.mjs drives that script as the OFFLOAD ORACLE
          # (bit-exact recovery, adversary-transcript independence, the Freivalds
          # check). Without it those 15 tests fail rather than skip, which is the
          # same signal-loss the paragraph above bought off — and worse here,
          # because the thing going unverified is a correctness oracle. Installed
          # rather than skipped for that reason. Distro numpy is deliberate: the
          # script uses only long-stable array APIs, and apt avoids PEP 668's
          # externally-managed-environment refusal that plain `pip install` hits
          # on current runner images.
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools python3-numpy python3-venv libgoogle-perftools4
          npm ci --no-audit --no-fund
          (cd relay && npm ci --no-audit --no-fund)
          (cd network && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Install source browser fixtures
        run: |
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          npx playwright install --with-deps chromium
      - name: Install CPU worker test dependency
        # Public-cache tests exercise the real worker's tensor arithmetic and
        # C-client reconnects. Use a CPU wheel in a venv; keep distro numpy and
        # leave the runner's system Python untouched.
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/shielded-test-python"
          timeout 180 "$RUNNER_TEMP/shielded-test-python/bin/python" -m pip install --disable-pip-version-check --no-input 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/shielded-test-python/bin/python" -c 'import numpy, torch; assert torch.version.cuda is None; print("CPU worker dependencies:", numpy.__version__, torch.__version__)'
          echo "$RUNNER_TEMP/shielded-test-python/bin" >> "$GITHUB_PATH"
      - name: Enable isolated UID fixtures on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build local chain artifacts
        run: forge build
      - name: Build the relay routing bundle
        # api-relay.js imports relay/network-runtime.bundle.mjs, which is gitignored and
        # built by relay/deploy.sh at deploy time; without it every test that starts
        # the relay dies on ERR_MODULE_NOT_FOUND
        run: node relay/build-network.mjs
      - name: node --test
        # npm test verbatim but with CI headroom on the per-file timeout:
        # Compilation fixtures need headroom on small runners; cap file concurrency
        # so independent compiler/browser processes do not exhaust runner memory.
        run: node scripts/test-source.mjs --test-shard=${{ matrix.shard }}/8

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
      - name: forge test (unit + fuzz + invariants)
        run: forge test -vv

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1   # anvil for the local chain
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd relay && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund)
          (cd network && npm ci --ignore-scripts --no-audit --no-fund)
      - name: forge build (MockUSDC artifact for the anvil chain)
        run: forge build
      - name: Build the relay routing bundle
        # the harness starts relay/api-relay.js (see the unit job)
        run: node relay/build-network.mjs
      - name: Install chromium
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Playwright
        run: cd e2e && npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.data/
            !e2e/.data/*.pem
          include-hidden-files: true   # .data/ is silently dropped without this
          retention-days: 7

  network-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: network/wg/go.mod
          cache-dependency-path: network/wg/go.sum
      - name: Enclave network circuit (enclave-wg)
        # no -race yet: the tests' own byte counters (wg_test.go) are read without synchronization
        working-directory: network/wg
        run: go test ./...
      - name: Windows persistent firewall helper
        working-directory: network/windows-firewall
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/enclave-circuit-firewall.exe .

  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd relay && npm ci --ignore-scripts --no-audit --no-fund)
          (cd network && npm ci --ignore-scripts --no-audit --no-fund)
          node relay/build-network.mjs
      - name: Build the complete hosted site and guest source bundles
        run: |
          node verifier/web/build.mjs
          npm run build:site
          node scripts/build-mcp-guest-bundle.mjs
          node scripts/build-platform-api-guest-bundle.mjs
      - name: Retain generated source for reproducible synchronization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-site-source
          path: |
            contracts/*.abi.json
            site/js/gen/contract-artifacts.js
            site/css/site.css
            metal/guest/mcp-server.bundle.mjs*
            metal/guest/platform-api.bundle.mjs*
            relay/network-runtime.bundle.mjs
            verifier/web/dist/
            site/vendor/enclave-verifier.js
          retention-days: 7

  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: isolation/m3/go.mod
          cache-dependency-path: isolation/m2/go.sum
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native desktop planning and manager boundaries
        run: node --test --test-concurrency=2 --test-timeout=120000 windows/vbslike/manager/*.test.mjs windows/vbslike/datapath/*.test.mjs relay/shield-desktop-*.test.mjs windows/node/desktop-release.test.mjs
      - name: Enable unprivileged namespace fixtures on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Native guest source
        run: |
          (cd isolation/contract && go test ./...)
          (cd isolation/m2 && go test ./front ./shieldbridge ./vsock)
          (cd isolation/m2 && go test -tags native_desktop ./front)
          (cd isolation/m3 && go test ./desktop ./desktopworker ./monitor)
          (cd isolation/m3 && go test -tags native_desktop ./monitor)
