# Integrity check for the wasmtime patch stack. The 11 patches only ever get
# applied for real inside a MANUAL "Wasmtime Toolchain" dispatch, so a patch
# edited out of sync with its siblings (they share files - nn-ggml applies
# 5th, the arbiter LAST, both touch ggml.rs) would sit broken on main until
# the next dispatch failed mid-cascade. This applies the full stack in
# Dockerfile order against the pinned wasmtime tag on every patch change -
# minutes-cheap, catches bitrot at the PR/push instead of the build.
#
# wasmparser-set-relax.patch is NOT in that loop and must not be added to it:
# it is a PLAIN unified diff against the vendored wasmparser crate root, not a
# git-format diff against the wasmtime tree, so `git apply` in /tmp/wasmtime
# would fail on a path that does not exist there. It gets its own step below,
# which vendors the pinned crate (sha256-checked) and dry-runs `patch -p1`.
# That step also has to run BEFORE the SET patch would be meaningful, because
# the SET patch's Cargo.toml points [patch.crates-io] at vendor/wasmparser.
name: wasmtime patch stack

on:
  push:
    branches: [main]
    paths: ["wasm/*.patch", "wasm/Dockerfile.wasmtime", ".github/workflows/wasmtime-patch-check.yml"]
  pull_request:
    paths: ["wasm/*.patch", "wasm/Dockerfile.wasmtime"]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Clone wasmtime at the pinned ref
        run: |
          # ONE source of truth: the ref comes out of Dockerfile.wasmtime's ARG,
          # so this check can never drift from what the toolchain build uses.
          # init+fetch (not clone --branch) because the ARG may be a commit sha —
          # coop threads shipped between wasmtime releases (docs/wasip3-threads.md).
          REF=$(sed -n 's/^ARG WASMTIME_VERSION=//p' "$GITHUB_WORKSPACE/wasm/Dockerfile.wasmtime")
          test -n "$REF" || { echo "::error::could not read WASMTIME_VERSION from Dockerfile.wasmtime"; exit 1; }
          echo "pinned ref: $REF"
          git init -q /tmp/wasmtime && cd /tmp/wasmtime
          git remote add origin https://github.com/bytecodealliance/wasmtime
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
      - name: Apply the stack in Dockerfile order
        run: |
          cd /tmp/wasmtime
          # order is load-bearing: later patches assume earlier hunks exist
          for p in wasmtime-onnx-gpu-strict wasmtime-vault-fs \
                   wasmtime-p2-host-header wasmtime-egress \
                   wasmtime-loopback wasmtime-nn-ggml wasmtime-nn-sdcpp \
                   wasmtime-nn-onnx-preload wasmtime-nn-arbiter \
                   wasmtime-set-threads wasmtime-socket-level-check; do
            git apply --check "$GITHUB_WORKSPACE/wasm/$p.patch" \
              || { echo "::error::$p.patch no longer applies (stack order or upstream drift)"; exit 1; }
            git apply "$GITHUB_WORKSPACE/wasm/$p.patch"
            echo "applied $p"
          done
      - name: Vendor the wasmparser fork and check its patch
        run: |
          cd /tmp/wasmtime
          # Pinned + hash-checked, mirroring wasm/Dockerfile.wasmtime. If these
          # drift apart the image build is the thing that breaks, so keep both.
          V=0.254.0
          SHA=d5769a29f799fbab136aaf65b4fe5384cd7d93fe6fc9ba0dcb6c8382a1f16e27
          curl -sSLf -o /tmp/wasmparser.crate \
            "https://static.crates.io/crates/wasmparser/wasmparser-$V.crate"
          echo "$SHA  /tmp/wasmparser.crate" | sha256sum -c -
          mkdir -p vendor/wasmparser
          tar -xzf /tmp/wasmparser.crate -C vendor/wasmparser --strip-components=1
          patch -p1 -d vendor/wasmparser --dry-run \
            < "$GITHUB_WORKSPACE/wasm/wasmparser-set-relax.patch" \
            || { echo "::error::wasmparser-set-relax.patch no longer applies to wasmparser $V"; exit 1; }
          patch -p1 -d vendor/wasmparser \
            < "$GITHUB_WORKSPACE/wasm/wasmparser-set-relax.patch"
          echo "applied wasmparser-set-relax to vendored wasmparser $V"
      - name: Resolve the graph (proves [patch.crates-io] points somewhere real)
        run: |
          cd /tmp/wasmtime
          # The SET patch redirects wasmparser to vendor/wasmparser. A wrong or
          # missing vendor dir fails at RESOLVE time with a confusing error, so
          # catch it here rather than 40 minutes into an image build.
          cargo metadata --format-version 1 > /tmp/meta.json
          python3 - <<'EOF'
          import json, sys
          m = json.load(open('/tmp/meta.json'))
          v = [p for p in m['packages']
               if p['name'] == 'wasmparser' and p['version'] == '0.254.0']
          if not v:
              sys.exit("::error::wasmparser 0.254.0 absent from the resolved graph")
          if v[0]['source'] is not None:
              sys.exit("::error::wasmparser 0.254.0 resolved from %s, not the vendored path"
                       % v[0]['source'])
          print("wasmparser 0.254.0 resolves to the vendored path")
          EOF
