  '''^\s*[+ -]?\s*"relay/node_modules/@peculiar/asn1-rsa/build/es2015/rsa_private_key\.js": "(?:d50563fd684db0ca09610432dadc71fbad88460d964b59439e22f566b1ce711b)",?\s*$''', # SHA256 digest of public dependency source, independently recomputed.
