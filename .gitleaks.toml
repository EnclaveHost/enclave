# same constraint as .githooks/scan-crypto-keys.py) AND the line must be exactly one of the 13 verified path/digest entries. It is
# reusable by any preserved snapshot stage because it names public file CONTENTS, never a location; another file name, another
# digest, extra content or a real token still fires.
