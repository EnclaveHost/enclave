[[allowlists]]
description = '''api_key_seed test constant: synthetic nibble-sequence seed used only in #[test] fns and a 127.0.0.1 wasmtime harness; identical value already public as SEED in checkpoints/.../related/enclave-apps/untracked/eyesoff-ai/tests/helpers/component.mjs'''
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^checkpoints/decentralization-20261022/external/diffs/work/app-auth-release-migration/scratch/apps/eyesoff-ai/src/lib\.rs\.diff$''',
  '''^checkpoints/decentralization-20261022/external/files/work/app-auth-final/browser-hand-signer\.mjs$''',
]
regexTarget = "line"
regexes = [
  '''^\s*\+        let both = cfg\(serde_json::json!\(\{ "sso": sso_block\(\), "wallet": wallet_block\(\), "api_key_seed": "s33d-0f1e2d3c4b5a69788796a5b4c3d2e1f0" \}\)\);\s*$''',
  '''^\s*\+        let c = cfg\(serde_json::json!\(\{ "sso": sso_block\(\), "wallet": wallet_block\(\), "api_key_seed": "s33d-0f1e2d3c4b5a69788796a5b4c3d2e1f0" \}\)\);\s*$''',
  '''^\s*\+        let no_sso = cfg\(serde_json::json!\(\{ "wallet": wallet_block\(\), "api_key_seed": "s33d-0f1e2d3c4b5a69788796a5b4c3d2e1f0" \}\)\);\s*$''',
  '''^\s*const cfg = \{ wallet: \{ audience: AUD, domains: \[host\], contract_wallets: rd\.contract_wallets \}, api_key_seed: 's33d-0f1e2d3c4b5a69788796a5b4c3d2e1f0' \};\s*$''',
]

