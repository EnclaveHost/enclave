  '''^\s*const deadline = BigInt\(now\(\) \+ 600\), tag = viem\.keccak256\(viem\.toHex\(op === 'add' \? 'EnclaveVault\.addKey\.v1' : 'EnclaveVault\.removeKey\.v1'\)\);\s*$''',
]

