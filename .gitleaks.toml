targetRules = ["ethereum-private-key-labelled"]
paths = [
  '''^checkpoints/decentralization-20261022/external/files/work/claude-resumed-20261022/cutover-review/measured-carrier-integration-r2/bundle/new/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/credit-final-composition/patches/final-minus-integrated\.patch$''',
  '''^checkpoints/decentralization-20261022/external/files/work/credit-vault-final-integration/patches/credit-vault-final-integration\.patch$''',
  '''^checkpoints/decentralization-20261022/external/files/work/host-lease-relay/stage/release/manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/host-relay-cli-repair/tree/metal/guest/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/host-relay-final-repair/tree/metal/guest/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/hosted-services-activation/tree-r3/metal/guest/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/lease-relay-activation/final-94f4ebdf/build-manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/lease-relay-release/stage/manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/platform-api-hosted/tree/metal/guest/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/resume-20261021/platform-bundle-smoke/control-out/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/windows-local-relay-main-composition/tree/metal/guest/platform-api\.bundle\.mjs\.manifest\.json$''',
  '''^checkpoints/decentralization-20261022/external/files/work/windows-local-relay-migration/stage/relay/release/manifest\.json$''',
