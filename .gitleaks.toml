  '''^\s*[+ -]?\s*"relay/node_modules/@peculiar/asn1-x509/build/es2015/extensions/private_key_usage_period\.js": "(?:20634ab3dc5f013799dc3bdc2e6cc4d9646917cdfc414cd3bc946eed1eb0488d)",?\s*$''', # SHA256 digest of public dependency source, independently recomputed.
  '''^\s*[+ -]?\s*"relay/node_modules/viem/_esm/accounts/generatePrivateKey\.js": "(?:0f2c44265a893e19b873236baa1d828965482af578ca49277ec7e96b04a178ab)",?\s*$''', # SHA256 digest of public dependency source, independently recomputed.
