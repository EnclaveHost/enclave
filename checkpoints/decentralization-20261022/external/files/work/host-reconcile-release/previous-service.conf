[Unit]
Description=Reconcile the Enclave network agent's apps with metal0's leases (upgrades, new deployments)
After=enclave-network-agent.service
[Service]
Type=oneshot
Environment=PATH=/home/steven/.local/bin:/usr/local/bin:/usr/bin:/bin
ExecStart=/usr/bin/flock -w 900 /home/steven/enclave-prod/enclave-network/.reconcile.lock /usr/bin/node /home/steven/enclave-prod/enclave-network/release-0835aaa1d/reconcile-apps.mjs --config /home/steven/enclave-prod/enclave-network/metal0/config.json --guestd-root /home/steven/enclave-prod/guestd-root --ipfs-repo /home/steven/enclave-prod/enclave-network/ipfs-cid --agent-unit enclave-network-agent.service
TimeoutStartSec=900
