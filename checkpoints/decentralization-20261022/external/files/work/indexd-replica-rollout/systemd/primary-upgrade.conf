# Drop-in for the EXISTING primary (minipc VM): /etc/systemd/system/enclave-indexd.service.d/20-fence-release.conf
# Only the binary path changes (release symlink managed by replicactl install/upgrade/rollback). Everything else
# in the live unit (user, caps, -instant with its existing consensus.db, ALLOW guard) is unchanged.
[Service]
ExecStart=
ExecStart=/opt/enclave-indexd/releases/current/indexd -instant
