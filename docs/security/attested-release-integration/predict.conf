# /etc/systemd/system/enclave-api-relay.service.d/predict.conf (NEW drop-in at activation). The predictor's children (git,
# go, python, sev-snp-measure, gzip) share the relay's cgroup: a cold prediction peaks ~504 MiB (memory.txt) on top of the
# relay's own ~194 MB peak, against the unit's 768M. Nothing else in the unit changes (the work dir is under its
# StateDirectory, /opt stays read-only under ProtectSystem=strict).
[Service]
MemoryMax=1536M
