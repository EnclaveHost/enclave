# Foundry is TEST-ONLY in this repo (PaymentRouter fuzz + invariant suite under
# contracts/foundry/test). Deploys stay on the solc-via-JS pipeline
# (scripts/deploy-*.mjs, scripts/build-contract-artifacts.mjs) — forge output
# under contracts/foundry/{out,cache} is gitignored and feeds nothing.
# Settings mirror the deploy pipeline (solc 0.8.35, optimizer runs 200) except
# via_ir, which is on globally so EnclaveAppCatalog compiles too (its deploy
# script passes viaIR; legacy codegen overflows on publishVersion's params).
[profile.default]
src = "contracts"
test = "contracts/foundry/test"
out = "contracts/foundry/out"
cache_path = "contracts/foundry/cache"
libs = ["contracts/foundry/lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "contracts/foundry/test/fixtures" }]

# Rev 15 negotiated rates and bound fee routing fit EIP-170 at runs=1.
[[profile.default.additional_compiler_profiles]]
name = "ledger"
optimizer = true
optimizer_runs = 1
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "contracts/EnclaveDeployments.sol"
optimizer_runs = 1

# The deployable ledger revision (live rev 15 + owner-approved delegates), outside src: only the
# tests that import it compile it, at the same runs=1 the deploy pipeline uses.
[[profile.default.compilation_restrictions]]
paths = "deploy/ledger/EnclaveDeployments.sol"
optimizer_runs = 1

# SessionVault: deployed once and cloned per owner; its size is the binding
# constraint, not per-call gas (the P-256 precompile dominates a session op).
[[profile.default.compilation_restrictions]]
paths = "contracts/SessionVault.sol"
optimizer_runs = 1

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false
