# production-bootstrap-wiring-stage (SOURCE ONLY; not installed): RELEASE MODE of enclave-base-holder.service. Install ONLY together with
# /opt/enclave-rpc/manifest.json baseRelease {path, sha256} + binaries.base = the release (bootstrap/release_install.py manifest): the
# wrapper refuses this drop-in's marker in legacy mode (chain_service.py release_launch_lock) and refuses release mode without it.
# The wrapper starts as root ONLY to hold the launch lock and durably append the one-shot journal entry under
# /etc/enclave-rpc/base-bootstrap, then drops to rpcbase:rpcbase itself (service_identity + drop_privileges, verified irreversible)
# BEFORE execve of the pinned release binary. Everything else of the base unit is UNCHANGED and inherited: MemoryMax=28G, MemoryHigh=25G,
# MemorySwapMax=0, OOMScoreAdjust, TasksMax, LimitNOFILE, NoNewPrivileges, ProtectSystem=strict, ProtectHome, PrivateTmp, UMask=0027,
# ReadWritePaths of the data and tmp subtrees, IPAddressDeny=10.0.2.2/32 (50-enclave-rpc-vm.conf), the permit/OnFailure/StartLimit/
# Restart=no of 50-finality-restart.conf. This file sets none of those keys.
[Service]
User=root
Group=root
Environment=ENCLAVE_BASE_LAUNCH_HANDSHAKE=1
# root phase needs only: read the rpcbase-owned datadir (identity/profile checks), initgroups/setresgid/setresuid for the drop, and
# own-datadir's lchown of root-created entries back to rpcbase; every capability is gone after the wrapper's drop to rpcbase
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_DAC_READ_SEARCH CAP_CHOWN
# the only ADDED writable paths: the launch journal directory (created by `arm`) and the launch lock file (created by `arm`). Not
# prefixed with "-": before `arm` the unit fails to set up its namespace instead of starting
ReadWritePaths=/etc/enclave-rpc/base-bootstrap/journal /etc/enclave-rpc/base-bootstrap/journal.lock
# never needed by the holder: the L1 pair's data, root's private A1/finality/install state, the engine JWT
InaccessiblePaths=-/srv/enclave-l1-pair -/var/lib/enclave-rpc -/etc/enclave-rpc/jwt.hex
# never start on a datadir that the snapshot download (or anything else) uses: a SKIPPED start, the download untouched
ExecCondition=/usr/bin/python3 -I -B /opt/enclave-rpc/bootstrap/holder_gate.py datadir-idle
# entries the root-run harness/arm/permit created in the stopped datadir go back to rpcbase (ownership only)
ExecStartPre=/usr/bin/python3 -I -B /opt/enclave-rpc/bootstrap/holder_gate.py own-datadir
# cold boot: wait (bounded) for the guest's own L1 to be ready before the wrapper's gates run
ExecStartPre=/usr/bin/python3 -I -B /opt/enclave-rpc/bootstrap/holder_gate.py wait-l1 3600
TimeoutStartSec=70min
