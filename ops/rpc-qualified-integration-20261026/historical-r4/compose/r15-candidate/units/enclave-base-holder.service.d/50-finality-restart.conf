# base-finality-proof-stage/r6 (SOURCE ONLY; drop-in for the existing base unit): every start first obtains the checked permit; a crash
# re-starts through enclave-base-recover.service (delayed, rate-limited) instead of Restart= (which would keep the unit "activating"
# and make the stopped-DB proof impossible). A refused permit leaves the node DOWN (never serving an unproven DB).
[Unit]
Requires=enclave-base-restart-permit.service
After=enclave-base-restart-permit.service
OnFailure=enclave-base-recover.service
StartLimitIntervalSec=1h
StartLimitBurst=5
[Service]
Restart=no
