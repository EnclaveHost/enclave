# /etc/systemd/system/enclave-rpc-gateway.service.d/50-attested-l1.conf on the control VM, as installed 2026-11-04 06:00Z
# and moved to release 52b83cbe1 (maxLagSeconds) on 2026-11-05 05:00Z; that drop-in is kept at
# /etc/enclave-rpc/50-attested-l1.conf.pre-maxlag, its config at config.deployment.json.pre-maxlag.
# The previous drop-in (release f31815e1b, config.attested.json with a fixed measurement list) is kept at
# /etc/enclave-rpc/50-attested-l1.conf.pre-deployment for rollback.
#
# config.deployment.json (not committed: it holds a provider credential) is config.attested.json with:
#   upstreams.base = ["https://192.168.8.249:18443/base", ...the previous four Base upstreams as fallbacks]
#   upstreams.ethereum = ["https://192.168.8.249:18443/l1"]   (unchanged: attested only, no fallback)
#   attested = {"https://192.168.8.249:18443": {"deployment": {rpcs: [mainnet.base.org, base-rpc.publicnode.com],
#     ledger 0xb1783b61..., catalog 0x18419ca2..., deployment 0x1abe9a34...0f2e, owner 0x0b2d009c...eE61,
#     appId 0x0f628585...b537, versionIndex 1}}}
#   maxLagSeconds = {"base": 120, "ethereum": 180}   (since 52b83cbe1: a stale upstream is tried after fresh ones)
# so the allowed measurement and the required HOST_DATA come from Base (rpc/snp/chain-policy.mjs), and the
# hand-maintained measurement list (r6-r10) is gone.
[Service]
LoadCredential=
LoadCredential=config.json:/etc/enclave-rpc/config.deployment.json
ExecStart=
ExecStart=/usr/bin/node /opt/enclave-rpc/releases/52b83cbe1/rpc/gateway.mjs ${CREDENTIALS_DIRECTORY}/config.json
