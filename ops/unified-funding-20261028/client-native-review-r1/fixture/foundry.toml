# client-native-r1 fixture: ONE labelled test mock (src/MockUSDC3009Fiat.sol, self-contained, no imports).
# Root compiles it through the shared queue (same settings as native-host-r1/fixture):
#   cd client-native-r1/fixture && forge build --offline
# Everything else the native test deploys is native-host-r1's root-pinned staging (session-r1/out etc.), unchanged.
[profile.default]
src = "src"
out = "out"
libs = []
solc_version = "0.8.35"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
offline = true
