# Standalone, TEST-ONLY Foundry project for unified-funding dex-r1 (LeaseGasDexAdapter).
# Mirrors r2/foundry.toml (itself mirroring source/foundry.toml): solc 0.8.35, optimizer 200, via_ir.
# Reuses the vendored forge-std, the lease-reserve source and r2's mocks READ-ONLY. No downloads; nothing deploys;
# no RPC is configured (the fork plan in FORK-TEST-PLAN.md is opt-in and separate).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../../contracts/foundry/lib"]
remappings = [
    "forge-std/=../../../contracts/foundry/lib/forge-std/src/",
    # the newer lease-reserve source, compiled only by test/LeaseGasDexAdapter.realReserve.t.sol
    "enclave-src/=../rfq-candidate/test/fixtures/",
    # r2 mocks (MockLedger, MockReserve), imported unmodified; this also compiles r2/src/LeaseGasFundingRouter.sol
    "r2/=../rfq-candidate/",
]
allow_paths = ["../../../contracts/foundry/lib", "../rfq-candidate/test/fixtures", "../rfq-candidate"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false
