# Standalone Foundry project for unified-funding session-r1 (FundingSessionVault successor + FundingGasLib).
# Release settings: solc 0.8.35, optimizer runs 1, via_ir - the original SessionVault's reproducible build settings.
# src/FundingSessionVault.sol does not exist until root runs `python3 prepare.py` (it is generated from the original).
# Reuses READ-ONLY: vendored forge-std, the enclave contracts (original SessionVault, ledger, catalog, book, router,
# lease-gas reserve, session mocks) and the dex-r1 adapter + DEX mocks. No RPC is configured; nothing deploys.
# No size-limit override anywhere: root measures runtime/initcode sizes with `forge build --sizes`.
# P-256: the tests require the NATIVE P256VERIFY precompile at 0x100 and FAIL (never etch, never skip) without it.
# If this Foundry's default EVM lacks it, root must choose an evm_version that has it and record that choice next to
# the size measurement (the release build's evm_version must match what was measured).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../source/contracts/foundry/lib"]
remappings = [
    "forge-std/=../../source/contracts/foundry/lib/forge-std/src/",
    "enclave-src/=../../../enclave/contracts/",
    "dex-r1/=../dex-r1/",
    "r2/=../r2/",
]
allow_paths = ["../../source/contracts/foundry/lib", "../../../enclave/contracts", "../dex-r1", "../r2"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 1
via_ir = true

[fuzz]
runs = 256
