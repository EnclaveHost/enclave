[package]
name = "pvmrt-sock-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "The pVM CPU tier's socket-server conformance app: a wasi:cli/run component that binds the port ENCLAVE_PORTS names and answers HTTP/1.1, the shape of the catalog's port-serving apps."

[[bin]]
name = "sock-probe"
path = "src/main.rs"

[profile.release]
opt-level = "s"
strip = true
