[package]
name = "pvm-rt"
version = "0.1.0"
edition = "2021"
publish = false
description = "The portable app runtime inside the Pixel pVM: a verified WebAssembly component, compiled in-VM to Pulley and interpreted (no executable page). PVM-CPU.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasmtime is pinned exactly: its version is part of the runtime identity the pVM attests (isolation/contract RuntimeIdentity).
wasmtime = { version = "=49.0.0", default-features = false, features = ["std", "runtime", "cranelift", "pulley", "component-model", "gc", "gc-drc", "async"] }
wasmtime-wasi = { version = "=49.0.0", default-features = false, features = ["p2"] }
# wasi:nn's WIT host glue only: no backend features (openvino/winml/onnx/pytorch); the one backend is nn.rs, over the
# payload's verified engine
wasmtime-wasi-nn = { version = "=49.0.0", default-features = false }
# wasi:http (milestone 4, src/httpd.rs): the incoming handler only. No `default-send-request`: no TLS client, no outgoing
# requests from the VM (http.rs refuses them).
wasmtime-wasi-http = { version = "=49.0.0", default-features = false, features = ["p2"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
http = "1"
# TLS terminating INSIDE the VM (httpd.rs, the serving prototype): TLS 1.3 only, ring as the one crypto provider (no
# aws-lc: nothing to cross-build in C beyond ring's own), a self-signed certificate over the VM's attested Ed25519
# transport key, made in the VM at open
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
# the browser channel (src/sealed.rs): HPKE (RFC 9180) for the request -- X25519, HKDF-SHA256, AES-128-GCM only, pure Rust,
# pinned; the response's HKDF and AES-GCM are ring's (already here for TLS)
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
ring = "0.17"
# the lease proof key (PROOF-KEY.md): secp256k1 ECDSA with RFC 6979 nonces, recovery ids and low-s (k256), and keccak256
# for the EIP-712 digest (sha3) -- pure Rust, no C to cross-build
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha3 = { version = "=0.10.9", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = "debuginfo"
