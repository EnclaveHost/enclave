<div class="cinema-media" aria-hidden="true">
  <img class="cinema-image" src="{image}" alt="" width="1672" height="941" decoding="async" />
  <video class="cinema-video" data-src="{video}" muted loop playsinline preload="none" tabindex="-1"></video>
</div>
<div class="cinema-shade" aria-hidden="true"></div>
<button class="cinema-pause" type="button" aria-pressed="false" aria-label="Pause motion" title="Pause motion" hidden>
  <svg class="cinema-icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4h5v16H5zM14 4h5v16h-5z"/></svg>
  <svg class="cinema-icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4v16l12-8z"/></svg>
</button>
