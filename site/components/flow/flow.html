<div class="flow">
  <div class="steps" role="tablist" aria-label="Lifecycle steps">
    <button class="step active" type="button" role="tab" id="flow-tab-1" aria-selected="true" tabindex="0" aria-controls="flow-detail"><span class="num">1</span><div><div class="st-t">Sign in</div><div class="st-d">Prove it's you with a key you hold. No email, no password.</div></div></button>
    <button class="step" type="button" role="tab" id="flow-tab-2" aria-selected="false" tabindex="-1" aria-controls="flow-detail"><span class="num">2</span><div><div class="st-t">Create a deployment</div><div class="st-d">Pick the app and its CPU and GPU shares. You own the record, and it survives enclave updates.</div></div></button>
    <button class="step" type="button" role="tab" id="flow-tab-3" aria-selected="false" tabindex="-1" aria-controls="flow-detail"><span class="num">3</span><div><div class="st-t">Fund runtime</div><div class="st-d">Payment credits runtime the moment it lands. Payments are final, so fund small and top up any time.</div></div></button>
    <button class="step" type="button" role="tab" id="flow-tab-4" aria-selected="false" tabindex="-1" aria-controls="flow-detail"><span class="num">4</span><div><div class="st-t">Verify the enclave</div><div class="st-d">Pull the CPU attestation and GPU report and check them yourself.</div></div></button>
    <button class="step" type="button" role="tab" id="flow-tab-5" aria-selected="false" tabindex="-1" aria-controls="flow-detail"><span class="num">5</span><div><div class="st-t">Stop (or let it expire)</div><div class="st-d">Tear down and release the share. Unspent runtime stays on the record for a later restart, but it can never be withdrawn.</div></div></button>
  </div>
  <div class="flow-detail" id="flow-detail" role="tabpanel" aria-labelledby="flow-tab-1" tabindex="0"></div>
</div>
