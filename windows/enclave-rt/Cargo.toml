[package]
name = "enclave-rt"
version = "0.1.0"
edition = "2021"
publish = false
description = "The wasm runtime that runs a tenant's app INSIDE the VBS enclave (VTL1)."

# staticlib: this is linked into ee-engine.dll, the enclave image itself. rlib so the host-side
# test harness can use the same code with std.
[lib]
name = "enclave_rt"
crate-type = ["staticlib", "rlib"]

[dependencies]
# runtime        : execution without cranelift. The enclave compiles NOTHING.
# pulley         : the portable bytecode interpreter. VTL1 has no executable pages to JIT into,
#                  which is the property VBS exists to enforce, so the app is interpreted from
#                  bytecode that was produced outside and carried in as data.
# component-model: what a platform app IS (a wasi-style component, not a core module).
# No "std": there is no OS in here. Measured on the built .lib, this needs ZERO Windows API
# imports - only malloc/free, the mem* intrinsics and two libm functions, all of which the
# enclave-flavoured CRT already provides.
# The LOCAL wasmtime-set tree, not crates.io 47. The path is relative to where this BUILDS - the
# box, C:\Users\claude\vbs\{enclave-rt,wasmtime-set} - not to this repository, which keeps the
# tree elsewhere. build-win.cmd runs on the box and nothing builds this crate here. SET lives there (the atomics in Pulley, the
# shared-memory soundness work, the no_std threading bridge, the fused adapters over a shared
# memory). `threads` is what makes a `shared` memory instantiable at all, and it no longer drags
# in `std` - see crates/wasmtime/src/runtime/vm/nostd_threads.rs.
wasmtime = { path = "../wasmtime-set/crates/wasmtime", default-features = false, features = ["runtime", "component-model", "pulley", "threads"] }
# So the runtime's own log:: macros have somewhere to go. Without a registered logger every
# log::warn! in wasmtime is silently discarded, which is not the same as nothing going wrong.
log = { version = "0.4", default-features = false }

[patch.crates-io]
wasmparser = { path = "../wasmtime-set/vendor/wasmparser" }

[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
